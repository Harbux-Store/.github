name: Laporan bug
description: Ada yang tidak berjalan semestinya
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melapor. Makin jelas langkah reproduksinya, makin cepat bisa diperbaiki.
  - type: textarea
    id: masalah
    attributes:
      label: Apa yang terjadi?
      description: Ceritakan singkat masalahnya.
    validations:
      required: true
  - type: textarea
    id: langkah
    attributes:
      label: Langkah untuk mengulangi
      placeholder: |
        1. Buka menu Transaksi
        2. Klik "+ Transaksi baru"
        3. Isi ... lalu simpan
        4. Muncul ...
    validations:
      required: true
  - type: textarea
    id: harapan
    attributes:
      label: Yang seharusnya terjadi
    validations:
      required: true
  - type: input
    id: lingkungan
    attributes:
      label: Browser dan perangkat
      placeholder: "Chrome 141 di Windows 11 / Safari di iPhone"
  - type: textarea
    id: tambahan
    attributes:
      label: Tangkapan layar atau catatan lain
      description: Sensor dulu data pribadi atau sandi sebelum diunggah.
